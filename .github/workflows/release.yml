name: release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release Gate: tag commit must be ancestor of main
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if git merge-base --is-ancestor ${TAG_SHA} origin/main ; then
              echo "OK: tag commit is on main branch"
          else
              echo "ERROR: tag commit NOT in main history"
              exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.9

      - name: fmt-check
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test
        run: make test

      - name: Build release package
        env:
          RAW_TAG: ${{ github.ref_name }}
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          VERSION=${RAW_TAG#v}
          echo VERSION=${VERSION}
          make package VERSION=${VERSION} BUILD_NO=${BUILD_NO} RUN_ID=${RUN_ID} COMMIT=${COMMIT}
          sha256sum dist/*.tar.gz dist/*.tar.gz.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $RAW_TAG dist/*.tar.gz dist/*.tar.gz.sha256 --title $RAW_TAG
