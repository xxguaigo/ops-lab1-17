name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.9

      - name: Print github context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "event_name=${EVENT_NAME}"
          echo "ref=${REF}"
          echo "sha=${SHA}"
          echo "pr_head_sha=${PR_HEAD_SHA}"

      - name: make fmt-check
        run: make fmt-check
      - name: make vet
        run: make vet
      - name: make test
        run: make test

      - name: Build package on main push
        if: github.event_name == 'push'
        env:
          VERSION: "0.0.0-main"
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package VERSION="$VERSION" BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"
          sha256sum "dist/enroll-conflict_${VERSION}_linux_amd64/enroll-conflict" dist/*.tar.gz
          (cd dist && sha256sum -c ./*.tar.gz.sha256)

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ github.sha }}-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
